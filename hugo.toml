baseURL = 'https://mikeogunmakin.github.io/'
languageCode = 'en-us'
title = 'Michael O.'
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true

[params]
  env = 'production'
  title = 'Michael O.'
  description = 'Projects I have built, articles I have written, and ideas I am exploring.'
  keywords = ['blog', 'portfolio', 'articles']
  author = 'Michael O.'
  mainSections = ['mresearch']
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  hideFooter = false

  [params.homeInfoParams]
    Title = "Entrepreneur & Data Scientist"
    Content = "Thinking differently. Building things. Sharing unstructured thoughts, ideas, and research along the way."

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/mikeogunmakin'

  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://www.linkedin.com/in/michael-og/'

  [[params.socialIcons]]
    name = 'payhip'
    title = 'Courses'
    url = 'https://payhip.com/mikeogunmakin'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[[menu.main]]
  identifier = 'info'
  name = 'Info'
  url = '/info/'
  weight = 10

[[menu.main]]
  identifier = 'mresearch'
  name = 'mResearch'
  title = 'microResearch'
  url = '/mresearch/'
  weight = 20

[[menu.main]]
  identifier = 'unotes'
  name = 'uNotes'
  title = 'unstructured Notes'
  url = '/unotes/'
  weight = 30

[[menu.main]]
  identifier = 'projects'
  name = 'Projects'
  url = '/projects/'
  weight = 40

[[menu.main]]
  identifier = 'search'
  name = 'Search'
  url = '/search/'
  weight = 50

[markup.highlight]
  noClasses = false
