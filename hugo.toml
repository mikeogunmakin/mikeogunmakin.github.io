baseURL = 'https://mikeogunmakin.github.io/'
languageCode = 'en-us'
title = 'Michael O.'
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true

[params]
  env = 'production'
  title = 'Michael O.'
  description = 'Projects I have built, articles I have written, and ideas I am exploring.'
  keywords = ['blog', 'portfolio', 'articles']
  author = 'Michael O.'
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  hideFooter = false

  [params.homeInfoParams]
    Title = "Hi there \U0001F44B"
    Content = "I'm a data scientist researching, building, and deploying machine learning and AI systems for personalisation and tailored user experiences. Interested in personalisation, product and growth data science, and quantitative finance."

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/mikeogunmakin'

  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://www.linkedin.com/in/michael-og/'

  [[params.socialIcons]]
    name = 'payhip'
    title = 'Courses'
    url = 'https://payhip.com/mikeogunmakin'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[[menu.main]]
  identifier = 'archive'
  name = 'Articles'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'about'
  name = 'About'
  url = '/about/'
  weight = 20

[[menu.main]]
  identifier = 'search'
  name = 'Search'
  url = '/search/'
  weight = 30

[markup.highlight]
  noClasses = false
